#spring.application.name=Cards

#Application Port
server:
  port: 8090

spring:
  application:
    name: "cards"
    version: v1
    #    MySQL Databse Connection properties
  datasource:
    url: jdbc:h2:mem:microservices
    username: sa
    password:
    driver-class-name: org.h2.Driver
    #    Jpa Connection Properties
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  config:
    import: "optional:configserver:http://localhost:8071/"
  profiles:
    active:
      - "default"

# Enabling all the endpoints of Spring boot actuator
management:
  endpoints:
    web:
      exposure:
        include: "*"

build:
  version: "3.0"
